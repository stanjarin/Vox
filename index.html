<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Lock</title>
<link rel="stylesheet" href="styles.css?v=8.4.1"></head><body>
<main id="lock">
  <div class="top"><div class="lockicon"><span class="shackle"></span><span class="lockbody"></span></div><div>Enter Passcode</div><div id="echo" class="echoField"></div></div>
  <div class="pad">
    <button id="rank1" class="rankKey"><span>1</span></button><button>2<small>ABC</small></button><button>3<small>DEF</small></button>
    <button id="rank4" class="rankKey"><span>4</span><small>GHI</small></button><button>5<small>JKL</small></button><button>6<small>MNO</small></button>
    <button id="rank7" class="rankKey"><span>7</span><small>PQRS</small></button><button id="rank8" class="rankKey"><span>10</span><small>TUV</small></button>
    <div id="spin" class="key spin" aria-label="spinner"><div id="track"></div></div>
    <i></i><button id="zero">0</button><i></i>
  </div>
  <button id="reset">Emergency</button><span id="cancel">Cancel</span>
</main>
<section id="fake" hidden><img src="home-content.png" alt=""></section>
<section id="done" hidden><img src="home-content.png" alt=""></section>
<script src="app.js?v=8.4.1"></script></body></html>
