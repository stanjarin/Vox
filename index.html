<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Lock</title>
<link rel="stylesheet" href="styles.css?v=7"></head><body>
<main id="lock">
  <div class="top"><div class="lockicon"><span class="shackle"></span><span class="lockbody"></span></div><div>Enter Passcode</div><div id="echo" class="echoField"></div></div>
  <div class="pad">
    <button>1</button><button>2<small>ABC</small></button><button>3<small>DEF</small></button>
    <button>4<small>GHI</small></button><button>5<small>JKL</small></button><button>6<small>MNO</small></button>
    <button>7<small>PQRS</small></button><button>8<small>TUV</small></button>
    <div id="spin" class="key spin" aria-label="spinner"><div id="track"></div></div>
    <i></i><button id="zero">0</button><i></i>
  </div>
  <button id="reset">Emergency</button><span id="cancel">Cancel</span>
</main>
<section id="fake" hidden>FAKE HOME<br><small>placeholder for your JPEG</small></section>
<section id="done" hidden>
<h1>Calculation test</h1>
<p id="c1"></p>
<p id="c2"></p>
<p id="calc"></p>
<p id="clip"></p>
<small>V6 diagnostic only — next version will hide this.</small><br>
<button onclick="resetAll()">Reset</button>
</section>
<script src="app.js?v=7"></script></body></html>
